version: "3.8"

# ==============================================================================
# Unlimited OCR Cloud — Oracle Always Free Ampere A1 (ARM64) Compose Stack
# Host Specs Target: 2 OCPUs, 12 GB RAM, Ubuntu 24.04 ARM64
# Invariant: Never run GPU/LLM models on this host.
# ==============================================================================

services:
  caddy:
    image: caddy:2.8.4-alpine
    container_name: ocr_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge_net
      - internal_net
    depends_on:
      control-plane:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.control_plane
    image: ocr-control-plane:arm64
    container_name: ocr_control_plane
    restart: unless-stopped
    env_file:
      - ../../.env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ocr_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ocr_cloud}
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_PATH=/var/data/vault
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=production
    volumes:
      - vault_data:/var/data/vault
    networks:
      - internal_net
      - edge_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2048M
        reservations:
          memory: 512M

  db:
    image: postgres:16-alpine
    container_name: ocr_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ocr_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-ocr_cloud}
    command: >
      postgres
      -c shared_buffers=1024MB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=3072MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c max_connections=100
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocr_user} -d ${POSTGRES_DB:-ocr_cloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2560M
        reservations:
          memory: 1024M

  redis:
    image: redis:7.2-alpine
    container_name: ocr_redis
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

volumes:
  db_data:
    name: ocr_db_data
  redis_data:
    name: ocr_redis_data
  caddy_data:
    name: ocr_caddy_data
  caddy_config:
    name: ocr_caddy_config
  vault_data:
    name: ocr_vault_data

networks:
  edge_net:
    name: ocr_edge_net
    driver: bridge
  internal_net:
    name: ocr_internal_net
    driver: bridge
    internal: true
